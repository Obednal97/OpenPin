[package]
name = "plaud-v2"
version = "2.1.4"
description = "Plaud NotePin S — Local sync, decrypt & transcribe"
authors = ["Oliver Bednal"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-decorum = "1"
tauri-plugin-single-instance = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
open = "5"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt"] }
url = "2"
libc = "0.2"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
chrono = "0.4"
dirs = "5"

[profile.dev]
codegen-units = 16
opt-level = 1
debug = 0
strip = "debuginfo"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
