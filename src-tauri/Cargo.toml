[package]
name = "plaud-v2"
version = "2.5.2"
description = "Plaud NotePin S — Local sync, decrypt & transcribe"
authors = ["Oliver Bednal"]
license = "MIT"
edition = "2021"
rust-version = "1.90"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.8.0"
tauri-plugin-dialog = "2.8.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
open = "5"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { version = "1", features = ["rt", "sync"] }
url = "2"
percent-encoding = "2"
libc = "0.2"
objc2 = "0.6"
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSNotification", "NSOperation", "NSString", "block2"] }
chrono = "0.4"
dirs = "5"
signal-hook = "0.4"
tauri-plugin-deep-link = "2.6.3"

[profile.dev]
codegen-units = 16
opt-level = 1
debug = 0
strip = "debuginfo"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
