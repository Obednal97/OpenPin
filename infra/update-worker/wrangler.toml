# Cloudflare Worker that proxies the Open Pin updater to the GitHub release API.
# Its name (and so its workers.dev URL) keeps the pre-rename name: installed apps call it.
# The repo is public, so no token is required. An optional read-only GH_TOKEN
# (Contents: read) only raises the GitHub API rate limit: `npx wrangler secret put GH_TOKEN`.
name = "plaud-v2-updates"
main = "src/index.js"
compatibility_date = "2026-10-01"
# Installed apps up to v2.5.x call the workers.dev URL; from Open Pin (v2.6.0)
# they call the custom domain. Keep both until old installs have updated.
workers_dev = true
routes = [
  { pattern = "openpin.bednal.com", custom_domain = true },
]

[observability]
enabled = true

# The last good /v1/latest answer per channel, served when GitHub refuses
# (unauthenticated API calls from Cloudflare hit GitHub's shared rate limit).
[[kv_namespaces]]
binding = "LAST_GOOD"
id = "cbab13b4c00247f3b30c72c956f55acb"

# Migration history. v1 created the ReportLimiter Durable Object for the old
# bug-report endpoint; v2 deletes it now that the endpoint is retired.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportLimiter"]

[[migrations]]
tag = "v2"
deleted_classes = ["ReportLimiter"]
