# Cloudflare Worker that proxies the Open Pin updater (and the retired bug reporter) to GitHub.
# Its name (and so its workers.dev URL) keeps the pre-rename name: installed apps call it.
# No secrets in this file: GH_TOKEN is a Worker secret (`npx wrangler secret put GH_TOKEN`).
name = "plaud-v2-updates"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[observability]
enabled = true

# Report rate limits + daily create/comment caps (see README "Limits").
# SQLite-backed, so it runs on the Workers Free plan.
[[durable_objects.bindings]]
name = "LIMITER"
class_name = "ReportLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ReportLimiter"]
